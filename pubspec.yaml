name: hawat_app
description: "Hawat for boat owners: trips, catch, sales and money."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^18.1.0
  dio: ^5.11.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  flutter_secure_storage: ^11.2.0
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  fl_chart: ^1.2.0
  cached_network_image: ^4.0.4
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  intl: ^0.20.3
  uuid: ^4.6.0
  package_info_plus: ^10.2.2
  device_info_plus: ^13.3.0
  connectivity_plus: ^7.3.2
  image_picker: ^1.2.4
  flutter_image_compress: ^2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  riverpod_generator: ^4.0.9
  freezed: ^4.0.3
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

  # Chakra Petch has no Arabic glyphs: Latin and digits use it and Arabic falls
  # through to Tajawal (fontFamilyFallback), exactly as on the web portal.
  fonts:
    - family: ChakraPetch
      fonts:
        - asset: assets/fonts/ChakraPetch-Regular.ttf
          weight: 400
        - asset: assets/fonts/ChakraPetch-Medium.ttf
          weight: 500
        - asset: assets/fonts/ChakraPetch-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ChakraPetch-Bold.ttf
          weight: 700
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
